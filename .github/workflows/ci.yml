name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run lint

      - name: Require WordPress env
        env:
          WORDPRESS_GRAPHQL_URL: ${{ secrets.WORDPRESS_GRAPHQL_URL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
        run: |
          test -n "$WORDPRESS_GRAPHQL_URL" || { echo "::error::Missing repo secret WORDPRESS_GRAPHQL_URL"; exit 1; }
          test -n "$PUBLIC_SITE_URL" || { echo "::error::Missing repo secret PUBLIC_SITE_URL"; exit 1; }

      - name: Build (strict — fails on any WordPress/GraphQL fallback)
        env:
          WORDPRESS_GRAPHQL_URL: ${{ secrets.WORDPRESS_GRAPHQL_URL }}
          PUBLIC_SITE_URL: ${{ secrets.PUBLIC_SITE_URL }}
          PUBLIC_LOGO_URL: ${{ secrets.PUBLIC_LOGO_URL }}
          PUBLIC_GA_ID: ${{ secrets.PUBLIC_GA_ID }}
          PUBLIC_META_PIXEL_ID: ${{ secrets.PUBLIC_META_PIXEL_ID }}
          PUBLIC_LINKEDIN_PARTNER_ID: ${{ secrets.PUBLIC_LINKEDIN_PARTNER_ID }}
          STRICT_FETCH: "1"
        run: npm run build
